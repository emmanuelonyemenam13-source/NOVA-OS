<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaOS – Web Desktop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ---------- RESET & BASE ---------- */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0f1c;
    padding: 16px 8px;
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ---------- VOLTEX LOGIN CARD ---------- */
  #login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    min-height: 100vh;
  }
  .card {
    background: #13131f;
    border: 1px solid #2a2a4a;
    border-radius: 18px;
    padding: 28px;
    width: 320px;
    text-align: center;
    box-shadow: 0 0 40px #6a3bff33;
    color: white;
    font-family: monospace;
  }
  .card h1 { letter-spacing: 6px; color: #a78bfa; margin: 0; }
  .card .sub { color: #666; font-size: 12px; margin: 10px 0 20px; }
  .boxes { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
  .boxes input {
    width: 48px; height: 48px;
    background: #0a0a12;
    border: 1px solid #3a3a5a;
    border-radius: 10px;
    color: white; text-align: center; font-size: 20px;
  }
  .card button {
    width: 100%; padding: 12px;
    background: #7c3aed; border: none;
    border-radius: 10px; color: white;
    font-weight: bold; margin-top: 15px;
    cursor: pointer; font-family: monospace;
  }
  .card button:hover { background: #6d28d9; }
  .line { height: 1px; background: linear-gradient(90deg, transparent, #7c3aed, transparent); margin: 18px 0; }
  .success { color: #22c55e; }
  .error { color: #ef4444; }
  #googleBox { display: none; }

  /* ---------- OS CONTAINER (hidden until login) ---------- */
  #os-root { display: none; }

  /* ---------- OS INTERNALS ---------- */
  .desktop-icon { width: 76px; padding: 8px 4px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: background .15s; }
  .desktop-icon:hover { background: rgba(255,255,255,.12); }
  .desktop-icon .icobox { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.35); }
  .desktop-icon .icolbl { color: #f1f5f9; font-size: 11px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.8); line-height: 1.2; }

  .win { position: absolute; display: flex; flex-direction: column; background: rgba(241,245,249,.97); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.45); border: 1px solid rgba(148,163,184,.3); animation: winIn .18s ease-out; min-width: 240px; min-height: 160px; }
  @keyframes winIn { from { opacity: 0; transform: scale(.94) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .win-titlebar { height: 34px; flex-shrink: 0; background: linear-gradient(180deg,#e2e8f0,#cbd5e1); display: flex; align-items: center; padding: 0 8px; gap: 8px; cursor: grab; border-bottom: 1px solid rgba(100,116,139,.25); }
  .win-titlebar:active { cursor: grabbing; }
  .win-title { font-size: 12px; font-weight: 600; color: #334155; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .win-ctl { width: 22px; height: 22px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #475569; background: transparent; transition: background .1s; }
  .win-ctl:hover { background: rgba(0,0,0,.1); }
  .win-ctl.close:hover { background: #ef4444; color: white; }
  .win-content { flex: 1; overflow: auto; background: #f8fafc; position: relative; }

  .task-app { height: 36px; min-width: 40px; padding: 0 10px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.08); color: #e2e8f0; font-size: 11px; font-family: inherit; transition: all .15s; flex-shrink: 0; white-space: nowrap; }
  .task-app:hover { background: rgba(255,255,255,.16); }
  .task-app.active { background: rgba(34,211,238,.25); box-shadow: inset 0 -2px 0 #22d3ee; }
  .task-app.minimized { opacity: .5; }

  .start-item { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; border-radius: 10px; cursor: pointer; transition: background .15s; }
  .start-item:hover { background: rgba(255,255,255,.1); }
  .start-item .icobox { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .start-item .sublbl { color: #e2e8f0; font-size: 10.5px; }

  .calc-display { background: #0f172a; color: #22d3ee; font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 500; text-align: right; padding: 18px 16px; min-height: 64px; overflow: hidden; word-break: break-all; }
  .calc-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: #cbd5e1; padding: 1px; }
  .calc-key { border: none; background: #f1f5f9; padding: 16px 0; font-size: 17px; font-weight: 500; cursor: pointer; color: #1e293b; font-family: inherit; transition: background .1s; }
  .calc-key:hover { background: #e2e8f0; }
  .calc-key.op { background: #f97316; color: white; font-weight: 600; }
  .calc-key.op:hover { background: #ea580c; }
  .calc-key.eq { background: #0d9488; color: white; font-weight: 700; }
  .calc-key.eq:hover { background: #0f766e; }
  .calc-key.fn { background: #e2e8f0; color: #64748b; font-size: 14px; }

  .term { background: #0a0f1c; color: #a5f3fc; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 10px; height: 100%; overflow: auto; line-height: 1.6; }
  .term .prompt { color: #22d3ee; }
  .term .err { color: #f87171; }
  .term-input-line { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .term-input { flex: 1; background: transparent; border: none; outline: none; color: #a5f3fc; font-family: inherit; font-size: 12.5px; caret-color: #22d3ee; }

  .note-item { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; cursor: pointer; font-size: 12px; color: #334155; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .note-item:hover { background: #f1f5f9; }
  .note-item .del { color: #94a3b8; font-size: 14px; cursor: pointer; padding: 0 4px; }
  .note-item .del:hover { color: #ef4444; }

  .file-row { padding: 9px 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13px; color: #334155; border-bottom: 1px solid #f1f5f9; }
  .file-row:hover { background: #f1f5f9; }

  .swatch { width: 100%; height: 56px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: transform .15s; }
  .swatch:hover { transform: scale(1.03); }
  .swatch.active { border-color: #22d3ee; }

  .win-content::-webkit-scrollbar { width: 8px; }
  .win-content::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  .term::-webkit-scrollbar { width: 8px; }
  .term::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
  #taskapps::-webkit-scrollbar { height: 0; }

  /* Music */
  .music-track { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; cursor: pointer; font-size: 13px; color: #334155; display: flex; align-items: center; gap: 10px; }
  .music-track:hover { background: #f1f5f9; }
  .music-track.active { background: #ccfbf1; border-left: 3px solid #0d9488; }
  .music-play-btn { width: 36px; height: 36px; border-radius: 50%; background: #0d9488; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }

  /* Trading */
  .chart-bar { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 8px; background: #0f172a; border-radius: 8px; }
  .chart-bar > div { flex: 1; background: linear-gradient(180deg,#22d3ee,#0d9488); border-radius: 2px 2px 0 0; transition: height .3s; }
  .coin-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #334155; }
  .coin-row:hover { background: #f1f5f9; }
  .buy-btn { background: #0d9488; color: white; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .sell-btn { background: #ef4444; color: white; border: none; border-radius: 6px; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; }

  /* Chat */
  .chat-msg { padding: 8px 12px; margin: 4px 8px; border-radius: 10px; font-size: 12px; max-width: 80%; word-wrap: break-word; }
  .chat-msg.self { background: #0d9488; color: white; margin-left: auto; border-bottom-right-radius: 2px; }
  .chat-msg.other { background: #e2e8f0; color: #1e293b; margin-right: auto; border-bottom-left-radius: 2px; }

  /* Download button */
  #download-btn-container {
    margin-top: 24px;
    text-align: center;
  }
  #download-btn {
    background: linear-gradient(135deg,#22d3ee,#0d9488);
    color: #0a0f1c;
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 8px 24px rgba(34,211,238,.3);
    transition: transform .15s, box-shadow .15s;
    letter-spacing: .5px;
  }
  #download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(34,211,238,.45);
  }
</style>
</head>
<body>

<!-- ========== VOLTEX SECURITY GATE ========== -->
<div id="login-container">
  <div class="card">
    <h1>VOLTEX</h1>
    <div class="sub">STEMX UI • SECURE ACCESS</div>
    <div class="line"></div>

    <div id="pinBox">
      <p>enter key 🔐</p>
      <div class="boxes">
        <input id="a" maxlength="1" type="password" inputmode="numeric">
        <input id="b" maxlength="1" type="password" inputmode="numeric">
        <input id="c" maxlength="1" type="password" inputmode="numeric">
        <input id="d" maxlength="1" type="password" inputmode="numeric">
      </div>
      <button onclick="checkPin()">Verify PIN</button>
      <p id="pinMsg"></p>
    </div>

    <div id="googleBox">
      <p>enter Google authx key 🔑</p>
      <p style="font-size:10px;color:#888">copy code::: rear@mir%## :::</p>
      <div class="boxes">
        <input id="g" style="width:100%" placeholder="656543" inputmode="numeric">
      </div>
      <button onclick="checkGoogle()">Confirm OTP</button>
      <p id="otpMsg"></p>
    </div>
  </div>
</div>

<!-- ========== NOVA OS DESKTOP (hidden until login) ========== -->
<div id="os-root"></div>

<!-- ========== DOWNLOAD BUTTON (always available) ========== -->
<div id="download-btn-container">
  <button id="download-btn" onclick="downloadNovaOS()">⬇ Download NovaOS HTML</button>
</div>

<script>
/* ================================================================
   VOLTEX LOGIN LOGIC
   ================================================================ */
function checkPin() {
  var A = document.getElementById('a').value;
  var B = document.getElementById('b').value;
  var C = document.getElementById('c').value;
  var D = document.getElementById('d').value;
  var sum = Number(A) + Number(B) + Number(C) + Number(D);

  if (A == 5 && B == 4 && C == 8 && D == 9 && sum == 26) {
    document.getElementById('pinMsg').innerHTML = "<span class='success'>PIN verified<br>proceeding.....</span>";
    setTimeout(function() {
      document.getElementById('pinBox').style.display = 'none';
      document.getElementById('googleBox').style.display = 'block';
    }, 800);
  } else {
    document.getElementById('pinMsg').innerHTML = "<span class='error'>wrong pin 📌<br>check network 😔</span>";
  }
}

function checkGoogle() {
  var key = document.getElementById('g').value;
  if (key == "656543") {
    document.getElementById('otpMsg').innerHTML = "<span class='success'>OTP VERIFIED ✔️<br><br>LOGIN SUCCESSFULL ✅🎉</span>";
    setTimeout(function() {
      showNovaOS();
    }, 1000);
  } else {
    document.getElementById('otpMsg').innerHTML = "<span class='error'>OTP NOT verified 😞<br>wrong OTP</span>";
  }
}

/* ================================================================
   SHOW NOVA OS AFTER LOGIN
   ================================================================ */
function showNovaOS() {
  var login = document.getElementById('login-container');
  if (login) login.style.display = 'none';

  var root = document.getElementById('os-root');
  root.style.display = 'block';
  root.style.width = '100%';
  root.style.maxWidth = '940px';
  root.style.height = '660px';
  root.style.margin = '0 auto';
  root.style.position = 'relative';
  root.style.overflow = 'hidden';
  root.style.borderRadius = '16px';
  root.style.boxShadow = '0 30px 80px rgba(0,0,0,.6)';
  root.style.userSelect = 'none';
  root.style.fontFamily = "'Inter', system-ui, sans-serif";

  buildNovaOS(root);
}

/* ================================================================
   BUILD NOVA OS
   ================================================================ */
function buildNovaOS(osRoot) {
  // ---- SVG icon helper (returns HTML string) ----
  function svgIcon(kind, color) {
    var p = '';
    if (kind === 'calc') p = '<rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><circle cx="8" cy="11" r=".8" fill="currentColor"/><circle cx="12" cy="11" r=".8" fill="currentColor"/><circle cx="16" cy="11" r=".8" fill="currentColor"/><circle cx="8" cy="15" r=".8" fill="currentColor"/><circle cx="12" cy="15" r=".8" fill="currentColor"/><circle cx="16" cy="15" r=".8" fill="currentColor"/><line x1="8" y1="19" x2="16" y2="19"/>';
    else if (kind === 'notes') p = '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>';
    else if (kind === 'term') p = '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>';
    else if (kind === 'files') p = '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>';
    else if (kind === 'settings') p = '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>';
    else if (kind === 'welcome') p = '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>';
    else if (kind === 'music') p = '<circle cx="9" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M21 3v13"/><path d="M9 6v12"/><path d="M21 3l-9 3"/>';
    else if (kind === 'trading') p = '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>';
    else if (kind === 'chat') p = '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>';
    return '<div class="icobox" style="background:' + color + ';"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:white;">' + p + '</svg></div>';
  }

  // ---- App registry ----
  var APPS = {
    welcome:    { name: 'Welcome',    icon: 'welcome',  color: 'linear-gradient(135deg,#22d3ee,#0d9488)', w: 380, h: 380, build: buildWelcome,    desktop: true },
    calculator: { name: 'Calculator', icon: 'calc',     color: 'linear-gradient(135deg,#f97316,#ea580c)', w: 280, h: 380, build: buildCalculator, desktop: true },
    notes:      { name: 'Notes',      icon: 'notes',    color: 'linear-gradient(135deg,#f59e0b,#d97706)', w: 420, h: 360, build: buildNotes,      desktop: true },
    terminal:   { name: 'Terminal',   icon: 'term',     color: 'linear-gradient(135deg,#1e293b,#0f172a)', w: 440, h: 320, build: buildTerminal,   desktop: true },
    files:      { name: 'Files',      icon: 'files',    color: 'linear-gradient(135deg,#3b82f6,#1d4ed8)', w: 380, h: 340, build: buildFiles,      desktop: true },
    settings:   { name: 'Settings',   icon: 'settings', color: 'linear-gradient(135deg,#64748b,#334155)', w: 360, h: 400, build: buildSettings,   desktop: false },
    music:      { name: 'Music',      icon: 'music',    color: 'linear-gradient(135deg,#a855f7,#7e22ce)', w: 380, h: 400, build: buildMusic,      desktop: true },
    trading:    { name: 'Trading',    icon: 'trading',  color: 'linear-gradient(135deg,#10b981,#047857)', w: 460, h: 440, build: buildTrading,    desktop: true },
    chat:       { name: 'Chat',       icon: 'chat',     color: 'linear-gradient(135deg,#3b82f6,#2563eb)', w: 380, h: 420, build: buildChat,       desktop: true }
  };

  var WALLPAPERS = [
    'linear-gradient(135deg,#0f172a 0%,#1e3a5f 45%,#0f766e 100%)',
    'linear-gradient(135deg,#7c2d12 0%,#be123c 50%,#78350f 100%)',
    'linear-gradient(135deg,#052e16 0%,#166534 50%,#0e7490 100%)',
    'linear-gradient(135deg,#1e1b4b 0%,#312e81 40%,#0c4a6e 100%)',
    'linear-gradient(135deg,#1c1917 0%,#44403c 50%,#1c1917 100%)'
  ];

  // ---- State ----
  var state = {
    z: 10,
    wins: {},
    wp: 0,
    notes: []
  };
  try { state.notes = JSON.parse(localStorage.getItem('nova_notes') || '[]'); } catch(e) { state.notes = []; }

  // ---- OS HTML structure ----
  osRoot.innerHTML = `
    <div id="boot" style="position:absolute;inset:0;background:#070b14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .5s;">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#22d3ee,#0d9488);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 0 40px rgba(34,211,238,.4);">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <div style="color:#e2e8f0;font-size:22px;font-weight:700;letter-spacing:4px;">NOVA OS</div>
      <div style="color:#64748b;font-size:12px;margin-top:6px;letter-spacing:1px;">Web Edition v1.0</div>
      <div style="width:180px;height:3px;background:#1e293b;border-radius:2px;margin-top:28px;overflow:hidden;">
        <div id="bootbar" style="height:100%;width:0%;background:linear-gradient(90deg,#22d3ee,#0d9488);border-radius:2px;transition:width .2s;"></div>
      </div>
      <div id="bootmsg" style="color:#475569;font-size:11px;margin-top:14px;font-family:'JetBrains Mono',monospace;">Initializing kernel...</div>
    </div>
    <div id="desktop" style="display:none;position:absolute;inset:0;">
      <div id="wallpaper" style="position:absolute;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 45%,#0f766e 100%);"></div>
      <div id="icons" style="position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:6px;z-index:1;"></div>
      <div id="winlayer" style="position:absolute;inset:0;bottom:56px;z-index:2;"></div>
      <div id="startmenu" style="display:none;position:absolute;left:10px;bottom:64px;width:300px;max-height:420px;z-index:50;background:rgba(15,23,42,.92);backdrop-filter:blur(18px);border:1px solid rgba(148,163,184,.2);border-radius:16px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.5);">
        <div style="color:#f1f5f9;font-size:13px;font-weight:600;margin-bottom:12px;letter-spacing:.5px;">APPLICATIONS</div>
        <div id="startgrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>
        <div style="border-top:1px solid rgba(148,163,184,.15);margin-top:14px;padding-top:12px;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:700;">G</div>
            <span style="color:#cbd5e1;font-size:12px;">Guest User</span>
          </div>
          <button id="powerbtn" style="background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;">Restart</button>
        </div>

  // ---- Clock ----
  function tick() {
    var d = new Date();

    clockEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

  // ---- Window manager ----
  function focus(id) {
    if (!state.wins[id]) return;
    state.wins[id].el.style.zIndex = ++state.z;
    renderTaskbar();
  }

  function openApp(id) {
    if (state.wins[id]) {
      if (state.wins[id].min) {
        state.wins[id].el.style.display = 'flex';
        state.wins[id].min = false;
      }
      focus(id);
      return;
    }
    var app = APPS[id];
    if (!app) return;
    var cw = winlayer.clientWidth, ch = winlayer.clientHeight;
    var w = Math.min(app.w, cw - 12), h = Math.min(app.h, ch - 8);
    var n = Object.keys(state.wins).length;

    var el = document.createElement('div');
    el.className = 'win';
    el.dataset.id = id;
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.left = Math.min(30 + n * 30, Math.max(4, cw - w - 6)) + 'px';
    el.style.top = Math.min(16 + n * 26, Math.max(4, ch - h - 6)) + 'px';
    el.style.zIndex = ++state.z;

    var titleIcon = svgIcon(app.icon, 'transparent')
      .replace('class="icobox"', 'class="icobox" style="width:22px;height:22px;border-radius:6px;background:' + app.color + ';box-shadow:none;"')
      .replace('width="20" height="20"', 'width="13" height="13"');

    el.innerHTML = '<div class="win-titlebar">' + titleIcon +
      '<span class="win-title">' + app.name + '</span>' +
      '<button class="win-ctl min" title="Minimize">&minus;</button>' +
      '<button class="win-ctl close" title="Close">&times;</button></div>' +
      '<div class="win-content"></div>';

    winlayer.appendChild(el);
    var content = el.querySelector('.win-content');

    el.addEventListener('pointerdown', function() { focus(id); });
    el.querySelector('.close').addEventListener('click', function(e) {
      e.stopPropagation();
      closeApp(id);
    });
    el.querySelector('.min').addEventListener('click', function(e) {
      e.stopPropagation();
      minimizeApp(id);
    });
    makeDrag(el, el.querySelector('.win-titlebar'));

    app.build(content, id);

    state.wins[id] = { el: el, min: false, name: app.name, color: app.color, icon: app.icon };
    startmenu.style.display = 'none';
    renderTaskbar();
  }

  function closeApp(id) {
    if (!state.wins[id]) return;
    state.wins[id].el.remove();
    delete state.wins[id];
    renderTaskbar();
  }

  function minimizeApp(id) {
    if (!state.wins[id]) return;
    state.wins[id].el.style.display = 'none';
    state.wins[id].min = true;
    renderTaskbar();
  }

  function renderTaskbar() {
    taskapps.innerHTML = '';
    Object.keys(state.wins).forEach(function(id) {
      var w = state.wins[id];
      var b = document.createElement('button');
      b.className = 'task-app' + (w.min ? ' minimized' : '') + (w.el.style.display !== 'none' ? ' active' : '');
      var iconHtml = svgIcon(w.icon, 'transparent')
        .replace('class="icobox"', 'class="icobox" style="width:20px;height:20px;border-radius:5px;background:' + w.color + ';box-shadow:none;"')
        .replace('width="20" height="20"', 'width="12" height="12"');
      b.innerHTML = iconHtml + '<span>' + w.name + '</span>';
      b.addEventListener('click', function() {
        if (w.min) {
          w.el.style.display = 'flex';
          w.min = false;
          focus(id);
        } else if (w.el.style.zIndex == state.z) {
          minimizeApp(id);
        } else {
          focus(id);
        }
      });
      taskapps.appendChild(b);
    });
  }

  function makeDrag(el, handle) {
    handle.addEventListener('pointerdown', function(e) {
      if (e.target.classList.contains('win-ctl')) return;
      e.preventDefault();
      var sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop;
      focus(el.dataset.id);
      function mv(ev) {
        var nx = ox + (ev.clientX - sx), ny = oy + (ev.clientY - sy);
        nx = Math.max(-el.offsetWidth + 70, Math.min(nx, el.parentElement.clientWidth - 40));
        ny = Math.max(0, Math.min(ny, el.parentElement.clientHeight - 30));
        el.style.left = nx + 'px';
        el.style.top = ny + 'px';
      }
      function up() {
        document.removeEventListener('pointermove', mv);
        document.removeEventListener('pointerup', up);
      }
      document.addEventListener('pointermove', mv);
      document.addEventListener('pointerup', up);
    });
  }

  function buildCalculator(c) {
    var expr = '';
    var disp = document.createElement('div');
    disp.className = 'calc-display';
    disp.textContent = '0';
    c.appendChild(disp);

    var grid = document.createElement('div');
    grid.className = 'calc-grid';
    var keys = [
      ['C', 'fn'], ['\u232B', 'fn'], ['%', 'op'], ['\u00F7', 'op'],
      ['7', ''], ['8', ''], ['9', ''], ['\u00D7', 'op'],
      ['4', ''], ['5', ''], ['6', ''], ['\u2212', 'op'],
      ['1', ''], ['2', ''], ['3', ''], ['+', 'op'],
      ['\u00B1', 'fn'], ['0', ''], ['.', ''], ['=', 'eq']
    ];
    keys.forEach(function(k) {
      var b = document.createElement('button');
      b.className = 'calc-key ' + k[1];
      b.textContent = k[0];
      b.addEventListener('click', function() { press(k[0]); });
      grid.appendChild(b);
    });
    c.appendChild(grid);

    function press(k) {
      if (expr === 'Error') expr = '';
      if (k === 'C') expr = '';
      else if (k === '\u232B') expr = expr.slice(0, -1);
      else if (k === '=') {
        try {
          var e = expr.replace(/\u00D7/g, '*').replace(/\u00F7/g, '/').replace(/\u2212/g, '-').replace(/%/g, '/100');
          if (!e) { disp.textContent = '0'; return; }
          var r = Function('"use strict";return (' + e + ')')();
          if (r === Infinity || isNaN(r)) expr = 'Error';
          else expr = String(Math.round(r * 1e10) / 1e10);
        } catch(err) { expr = 'Error'; }
      } else if (k === '\u00B1') {
        var m = expr.match(/(-?[\d.]+)$/);
        if (m) {
          var num = parseFloat(m[1]);
          expr = expr.slice(0, m.index) + (num > 0 ? '-' : '') + Math.abs(num);
        }
      } else expr += k;
      disp.textContent = expr || '0';
    }
  }

  function buildTerminal(c) {
    c.innerHTML = '<div class="term" id="termout"></div>';
    var out = c.querySelector('#termout');
    function print(t, cls) {
      var d = document.createElement('div');
      if (cls) d.className = cls;

      out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    }
    print('<span class="prompt">NovaOS Terminal v1.0</span> — type <span class="prompt">help</span> to begin.');

    var inputLine = document.createElement('div');
    inputLine.className = 'term-input-line';
    inputLine.innerHTML = '<span class="prompt">guest@nova:~$</span><input class="term-input" id="terminput" autocomplete="off" spellcheck="false">';
    out.appendChild(inputLine);
    var inp = inputLine.querySelector('#terminput');
    setTimeout(function() { inp.focus(); }, 50);
    c.addEventListener('click', function() { inp.focus(); });

    function run(cmd) {
      var parts = cmd.trim().split(/\s+/);
      var name = parts[0].toLowerCase();
      if (name === 'help') print('Commands: help &nbsp; about &nbsp; date &nbsp; whoami &nbsp; echo &nbsp; ls &nbsp; open &lt;app&gt; &nbsp; theme &nbsp; neofetch &nbsp; clear');
      else if (name === 'about') print('NovaOS Web Edition — a desktop OS rendered in pure HTML/CSS/JS.');
      else if (name === 'date') print(new Date().toString());
      else if (name === 'whoami') print('guest');
      else if (name === 'echo') print(parts.slice(1).join(' ') || '');
      else if (name === 'ls') print('Documents/ &nbsp; Downloads/ &nbsp; Pictures/ &nbsp; Music/ &nbsp; readme.txt');
      else if (name === 'open') {
        var app = parts[1];
        if (app && APPS[app]) { print('Opening ' + app + '...'); openApp(app); }
        else print('App not found. Available: ' + Object.keys(APPS).join(', '), 'err');
      } else if (name === 'theme') {
        state.wp = (state.wp + 1) % WALLPAPERS.length;
        wallpaper.style.background = WALLPAPERS[state.wp];
        print('Wallpaper changed to theme #' + (state.wp + 1));
      } else if (name === 'neofetch') {
        print('<pre style="margin:0;color:#22d3ee;">   ....    </pre>  guest@nova<br>  OS: NovaOS Web 1.0<br>  Shell: novash 1.0<br>  Resolution: ' + OS.clientWidth + 'x660<br>  DE: Nova Desktop<br>  CPU: JavaScript V8<br>  Memory: ' + navigator.hardwareConcurrency + ' cores available');
      } else if (name === 'clear') out.innerHTML = '';
      else if (name === '') {}
      else print('novash: command not found: ' + name, 'err');
    }

    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var cmd = inp.value;
        print('<span class="prompt">guest@nova:~$</span> ' + cmd.replace(/</g, '&lt;'));
        run(cmd);
        out.appendChild(inputLine);
        inp.value = '';
        setTimeout(function() { inp.focus(); }, 10);
      }
    });
  }

          '<button id="nextBtn" style="background:transparent;border:none;color:#94a3b8;font-size:20px;cursor:pointer;">⏭</button>' +
        '</div>' +
      '</div>' +
      '<div style="font-size:11px;font-weight:600;color:#334155;margin-bottom:6px;">PLAYLIST</div>' +
      '<div id="trackList" style="flex:1;overflow:auto;border:1px solid #e2e8f0;border-radius:10px;"></div>' +
      '</div>';

    var trackName = c.querySelector('#trackName');
    var trackArtist = c.querySelector('#trackArtist');
    var progressFill = c.querySelector('#progressFill');
    var playBtn = c.querySelector('#playBtn');
    var trackList = c.querySelector('#trackList');
    var progress = 0;
    var interval = null;

    function updateTrack() {
      trackName.textContent = tracks[currentTrack].name;
      trackArtist.textContent = tracks[currentTrack].artist;
      progress = 0;
      progressFill.style.width = '0%';
      renderList();
    }

    function renderList() {
      trackList.innerHTML = '';
      tracks.forEach(function(t, i) {
        var row = document.createElement('div');
        row.className = 'music-track' + (i === currentTrack ? ' active' : '');
        row.innerHTML = '<span style="color:#0d9488;font-weight:700;">' + (i + 1) + '</span>' +
          '<div style="flex:1;"><div style="font-weight:600;">' + t.name + '</div><div style="font-size:11px;color:#94a3b8;">' + t.artist + '</div></div>' +
          '<span style="font-size:11px;color:#94a3b8;">' + t.dur + '</span>';
        row.addEventListener('click', function() {
          currentTrack = i;
          updateTrack();
          if (isPlaying) startPlayback();
        });
        trackList.appendChild(row);
      });
    }

    function startPlayback() {
      if (interval) clearInterval(interval);
      interval = setInterval(function() {
        if (!isPlaying) return;
        progress += 1;
        if (progress > 100) progress = 0;
        progressFill.style.width = progress + '%';
      }, 400);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸' : '▶';
      if (isPlaying) startPlayback();
      else if (interval) { clearInterval(interval); interval = null; }
    }

    playBtn.addEventListener('click', togglePlay);
    c.querySelector('#prevBtn').addEventListener('click', function() {
      currentTrack = (currentTrack - 1 + tracks.length) % tracks.length;
      updateTrack();
      if (isPlaying) startPlayback();
    });
    c.querySelector('#nextBtn').addEventListener('click', function() {
      currentTrack = (currentTrack + 1) % tracks.length;
      updateTrack();
      if (isPlaying) startPlayback();
    });

    updateTrack();
  }

  function buildTrading(c) {
    var coins = [
      { symbol: 'BTC', name: 'Bitcoin',  price: 67432.18, change:  2.34, holdings: 0.05 },
      { symbol: 'ETH', name: 'Ethereum', price:  3521.47, change: -1.12, holdings: 1.2  },
      { symbol: 'SOL', name: 'Solana',   price:   172.83, change:  5.67, holdings: 12   },
      { symbol: 'ADA', name: 'Cardano',  price:   0.6234, change:  1.89, holdings: 1500 },
      { symbol: 'DOT', name: 'Polkadot', price:     8.91, change: -0.45, holdings: 50   }
    ];
    var cash = 10000;
    var chartData = [40, 55, 48, 62, 70, 58, 65, 80, 72, 85, 78, 92, 88, 95, 82, 90, 75, 88, 95, 98];
    var selectedCoin = 0;

    function render() {
      var coin = coins[selectedCoin];
      var totalValue = cash + coins.reduce(function(sum, cc) { return sum + cc.price * cc.holdings; }, 0);
      var holdingsValue = coins.reduce(function(sum, cc) { return sum + cc.price * cc.holdings; }, 0);

      c.innerHTML = '<div style="padding:14px;height:100%;display:flex;flex-direction:column;gap:12px;">' +
        '<div style="display:flex;gap:10px;">' +
          '<div style="flex:1;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:10px;padding:12px;">' +
            '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;">Wallet Balance</div>' +
            '<div style="font-size:20px;font-weight:700;color:#22d3ee;margin-top:4px;">$' + totalValue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</div>' +
            '<div style="font-size:10px;color:#64748b;margin-top:2px;">Cash: $' + cash.toLocaleString() + ' • Holdings: $' + holdingsValue.toLocaleString() + '</div>' +
          '</div>' +
          '<div style="flex:1;background:linear-gradient(135deg,#0f172a,#1e293b);border-radius:10px;padding:12px;">' +
            '<div style="font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;">24h Change</div>' +
            '<div style="font-size:20px;font-weight:700;color:' + (coin.change >= 0 ? '#22c55e' : '#ef4444') + ';margin-top:4px;">' + (coin.change >= 0 ? '+' : '') + coin.change.toFixed(2) + '%</div>' +
            '<div style="font-size:10px;color:#64748b;margin-top:2px;">' + coin.symbol + '/USD</div>' +
          '</div>' +
        '</div>' +
        '<div style="background:#0f172a;border-radius:10px;padding:10px;">' +
          '<div style="font-size:10px;color:#94a3b8;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;">' + coin.symbol + ' Price Chart</div>' +
          '<div class="chart-bar" id="chartBars"></div>' +
          '<div style="font-size:16px;font-weight:700;color:#f1f5f9;margin-top:6px;text-align:right;">$' + coin.price.toLocaleString() + '</div>' +
        '</div>' +
        '<div style="flex:1;overflow:auto;border:1px solid #e2e8f0;border-radius:10px;background:white;">' +
          '<div style="padding:8px 14px;font-size:10px;color:#94a3b8;border-bottom:1px solid #e2e8f0;font-weight:600;">MARKET</div>' +
          '<div id="coinList"></div>' +
        '</div>' +
        '</div>';

      // chart
      var chartBars = c.querySelector('#chartBars');
      chartData.forEach(function(v) {
        var bar = document.createElement('div');
        bar.style.height = v + '%';
        chartBars.appendChild(bar);
      });

      // coin list
      var coinList = c.querySelector('#coinList');
      coins.forEach(function(co, i) {
        var row = document.createElement('div');
        row.className = 'coin-row';
        row.style.cursor = 'pointer';
        row.style.background = i === selectedCoin ? '#f0fdfa' : 'transparent';
        row.innerHTML = '<div style="width:32px;height:32px;border-radius:50%;background:' + (i === selectedCoin ? '#0d9488' : '#e2e8f0') + ';display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:' + (i === selectedCoin ? 'white' : '#475569') + ';">' + co.symbol[0] + '</div>' +
          '<div style="flex:1;"><div style="font-weight:600;">' + co.symbol + '</div><div style="font-size:10px;color:#94a3b8;">' + co.holdings + ' held</div></div>' +
          '<div style="text-align:right;margin-right:8px;"><div style="font-weight:600;">$' + co.price.toLocaleString() + '</div><div style="font-size:10px;color:' + (co.change >= 0 ? '#22c55e' : '#ef4444') + ';">' + (co.change >= 0 ? '+' : '') + co.change + '%</div></div>' +
          '<div style="display:flex;gap:4px;"><button class="buy-btn" data-i="' + i + '">Buy</button><button class="sell-btn" data-i="' + i + '">Sell</button></div>';
        row.addEventListener('click', function(e) {
          if (e.target.tagName === 'BUTTON') return;
          selectedCoin = i;
          render();
        });
        coinList.appendChild(row);
      });

      // buy/sell handlers
      c.querySelectorAll('.buy-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var i = parseInt(btn.dataset.i);
          var co = coins[i];
          var amount = co.price * 0.1; // buy 0.1 units
          if (cash >= amount) {
            cash -= amount;
            co.holdings += 0.1;
            render();
          } else {
            alert('Insufficient cash!');
          }
        });
      });
      c.querySelectorAll('.sell-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var i = parseInt(btn.dataset.i);
          var co = coins[i];
          if (co.holdings >= 0.1) {
            co.holdings -= 0.1;
            cash += co.price * 0.1;
            render();
          } else {
            alert('Insufficient holdings!');
          }
        });
      });
    }

    render();
  }

  function buildChat(c) {
    var messages = [
      { from: 'other', text: "Hey! Welcome to Nova Chat 👋" },
      { from: 'other', text: "I'm your AI assistant. Ask me anything!" }
    ];
    c.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;">' +

        '<div><div style="font-size:13px;font-weight:600;color:#0f172a;">Nova Assistant</div><div style="font-size:10px;color:#22c55e;">● Online</div></div>' +
      '</div>' +
      '<div id="chatMessages" style="flex:1;overflow:auto;padding:8px;background:#f8fafc;"></div>' +
      '<div style="padding:10px;border-top:1px solid #e2e8f0;display:flex;gap:8px;background:white;">' +
        '<input id="chatInput" placeholder="Type a message..." style="flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;color:#1e293b;">' +
        '<button id="sendBtn" style="background:#3b82f6;color:white;border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;">Send</button>' +
      '</div></div>';

    var msgContainer = c.querySelector('#chatMessages');
    var input = c.querySelector('#chatInput');
    var sendBtn = c.querySelector('#sendBtn');

    function renderMessages() {
      msgContainer.innerHTML = '';
      messages.forEach(function(m) {
        var d = document.createElement('div');
        d.className = 'chat-msg ' + m.from;
        d.textContent = m.text;
        msgContainer.appendChild(d);
      });
      msgContainer.scrollTop = msgContainer.scrollHeight;
    }

    function sendMessage() {
      var text = input.value.trim();
      if (!text) return;
      messages.push({ from: 'self', text: text });
      input.value = '';
      renderMessages();

      setTimeout(function() {
        var replies = [
          "That's interesting! Tell me more.",
          'I see. How can I help you with that?',
          'NovaOS is running smoothly! 🚀',
          "Have you tried the Trading app? It's pretty cool.",
          'You can check out the Music app for some tunes!',
          'The Terminal has hidden commands. Try "help".',
          'Feel free to explore all the apps on the desktop!'
        ];
        var reply = replies[Math.floor(Math.random() * replies.length)];
        messages.push({ from: 'other', text: reply });
        renderMessages();
      }, 800);
    }

    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') sendMessage();
    });

    renderMessages();
  }

  /* ================================================================
     BOOT SEQUENCE
     ================================================================ */
  function doBoot() {
    var msgs = ['Initializing kernel...', 'Mounting file system...', 'Starting services...', 'Loading desktop...'];
    var p = 0;
    bootbar.style.width = '0%';
    var iv = setInterval(function() {
      p += 4;
      bootbar.style.width = Math.min(p, 100) + '%';
      if (p % 25 === 0 && msgs[p / 25 - 1]) bootmsg.textContent = msgs[p / 25 - 1];
      if (p >= 100) {
        clearInterval(iv);
        setTimeout(function() {
          boot.style.opacity = '0';
          setTimeout(function() {
            boot.style.display = 'none';
            desktop.style.display = 'block';
            openApp('welcome');
          }, 500);
        }, 300);
      }
    }, 60);
  }
  doBoot();
}
